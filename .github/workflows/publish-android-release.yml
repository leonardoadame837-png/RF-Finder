name: Publish RF Finder Android APK

on:
  workflow_run:
    workflows:
      - RF Finder Android APK
    types:
      - completed

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download successful Android APK
        uses: actions/download-artifact@v5
        with:
          name: rf-finder-android-debug
          path: release
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify APK
        run: |
          test -f release/app-debug.apk
          ls -lh release/app-debug.apk

      - name: Create or update Developer Latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="developer-latest"
          APK="release/app-debug.apk"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK"               --repo "$GITHUB_REPOSITORY"               --clobber
          else
            gh release create "$RELEASE_TAG" "$APK"               --repo "$GITHUB_REPOSITORY"               --title "RF Finder Developer — Latest"               --notes "Automatically updated from the latest successful RF Finder Android APK build. This is a developer/testing build."               --prerelease
          fi

      - name: Verify release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view developer-latest             --repo "$GITHUB_REPOSITORY"             --json assets             --jq '.assets[].name' | grep -Fx 'app-debug.apk'
