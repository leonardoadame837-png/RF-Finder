name: Publish RF Finder Android APK

on:
  workflow_run:
    workflows:
      - RF Finder Android APK
    types:
      - completed

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download successful Android APK
        uses: actions/download-artifact@v5
        with:
          name: rf-finder-android-debug
          path: release
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify APK
        run: |
          test -f release/app-debug.apk
          ls -lh release/app-debug.apk

      - name: Create immutable developer release with APK
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          RELEASE_TAG="android-build-${RUN_NUMBER}"

          gh release create "${RELEASE_TAG}"             release/app-debug.apk             --repo "${GITHUB_REPOSITORY}"             --target "${HEAD_SHA}"             --title "RF Finder Android Developer Build #${RUN_NUMBER}"             --notes "Automatically published from successful RF Finder Android workflow run #${RUN_NUMBER}. This is a developer/testing APK."             --prerelease

      - name: Verify release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          gh release view "android-build-${RUN_NUMBER}"             --repo "${GITHUB_REPOSITORY}"             --json assets             --jq '.assets[].name' | grep -Fx 'app-debug.apk'
