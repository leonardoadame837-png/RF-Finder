name: RF Finder Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build Android debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Package source
        run: git archive --format=zip --output="rf-finder-source-${GITHUB_REF_NAME}.zip" HEAD

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            android/app/build/outputs/apk/debug/app-debug.apk \
            "rf-finder-source-${GITHUB_REF_NAME}.zip" \
            --generate-notes \
            --title "RF Finder ${GITHUB_REF_NAME}"
