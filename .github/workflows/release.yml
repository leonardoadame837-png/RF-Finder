name: RF Finder Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package source
        run: git archive --format=zip --output="rf-finder-source-${GITHUB_REF_NAME}.zip" HEAD

      - name: Upload source workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: rf-finder-release-${{ github.ref_name }}
          path: rf-finder-source-${{ github.ref_name }}.zip
          if-no-files-found: error

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              "rf-finder-source-${GITHUB_REF_NAME}.zip" \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              "rf-finder-source-${GITHUB_REF_NAME}.zip" \
              --generate-notes \
              --title "RF Finder ${GITHUB_REF_NAME}"
          fi
